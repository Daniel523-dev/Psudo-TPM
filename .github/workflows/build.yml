name: Build Encryption and TPM (Windows)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build TPM Windows Binary
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install nuitka
          python -m pip install cryptography argon2-cffi pywin32 zstandard numpy psutil pyyaml bcrypt

      - name: Build modules and executable (Windows)
        shell: pwsh
        run: |
          # 1. Build Encryption as an independent module
          python -m nuitka `
            --module `
            --output-dir=dist `
            Encryption.py

          # 2. Build TPM as a standalone executable with Nuitka
          python -m nuitka `
            --standalone `
            --onefile `
            --output-dir=dist `
            --include-module=Encryption `
            --include-module=util `
            --include-plugin-enable=anti-bloat `
            --lto=yes `
            TPM.py

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TPM-windows-binaries
          path: |
            dist
          if-no-files-found: error
